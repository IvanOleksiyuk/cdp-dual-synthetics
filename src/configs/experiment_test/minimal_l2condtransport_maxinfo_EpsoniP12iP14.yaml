workdir_path: null
dataset_path: null

defaults:
  - _self_
  - callbacks: default_callbacks.yaml
  - loggers: default_loggers.yaml

paths:
  model_name: "l2cond_EpsoniP12iP14_dev"
  workdir_path: null
  dataset_path: null
  full_path: "${paths.workdir_path}${paths.model_name}/"

wandb_key: null

project_name: "transit_project"
network_name: ${paths.model_name}

seed: 42
full_resume: false
compile: false
debug: false

train_range: null
valid_range: null
test_range: null

block_side: 64
block_stride: 64

data:
  datamodule:
    _target_: "src.data.data.CDPDatamodule"
    dataset_path: ${paths.dataset_path}
    batch_size: 16
    num_workers: 16
    n_captures: 2
    pin_memory: True
    allowed_suffixes: ["o55Epson", "o55iP12w", "o55iP14w"]  # Updated original suffixes "o_p2", "o_s1"
    allowed_suffixes_x1: null
    allowed_suffixes_x2: null
    #fixed_testing_pair: ["o55Epson", "o55iP12w"]
  export_datamodule:
    _target_: "src.data.data_new_datamodule.NewCDPDatamodule"
    dataset_config:
      dataset_base_path: ${paths.dataset_path}../wifs2024dataset/wifs2024dataset
      template_data:  "tem"
      original_data_x1: null
      original_data_x2: null
      uid_range: ${test_range}
      block_settings:
        block_h: ${block_side}
        block_w: ${block_side}
        stride_h: ${block_stride}
        stride_w: ${block_stride}
    batch_size: 16
    num_workers: 8
    pin_memory: True

model:
  _target_: "src.model.image_transit.ImageTRANSIT"
  # Define network backbones
  encoder_net: "my_stacked_unet"  # Specify the encoder network
  generator_net: "my_stacked_unet"  # Specify the generator network
  
  # Define inputs, channels and interconnections
  image_chan: 1
  latent_chan: 1
  conditional: True
  conditional_encoder: True        # Enable conditional encoder
  encoder_concat_in: ["x2"]
  generator_concat_in: ["zt", "enc_out"]

  # Loss configs
  encoder_train_direct_MSE: False   # Train encoder together with the generator
  
  # Optimization configs
  learning_rate: 0.001
  dropout_p: 0.1

  # Misc
  do_validate_encoder: False         # Validate the encoder during training

trainer:
  _target_: "pytorch_lightning.Trainer"
  max_epochs: 20
  accumulate_grad_batches: 1

ckpt_path: null

export:
  checkpoint: "${paths.full_path}checkpoints/last.ckpt"
  export_dir: "${paths.full_path}outputs/test_transformed"
  reference_name: "reference"
  classes: "allowed"